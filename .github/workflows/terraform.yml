name: Provision Forge infra

# Plans on PRs that touch infra, applies on merge to main. Auth is OIDC, so no
# Azure credentials are stored in the repo.
#
# The state backend (resource group, storage account, container) is NOT created
# here — Terraform cannot hold its own backend. Create it once by hand; the
# commands are in infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for azure/login OIDC

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform init

      - run: terraform validate

      - run: terraform plan -no-color -input=false -out=tfplan

      # Only on a merge to main — a PR stops after the plan.
      - if: github.event_name == 'push'
        run: terraform apply -no-color -input=false tfplan
